# Transferia — Benchmark Configuration (PQv1 → ClickHouse)
#
# Run:
#   transferia --config config_bench.yaml --total-workers 1 --worker-index 0

source:
  pqv1:
    connection_string: ""
    topic_path: "/cdc/prod/logs"
    consumer_name: "cdc/prod/timmyb32r-test-consumer-00"
    discovery_endpoint: ""
    partition_ids: [0]
    auth:
      type: access_token
      token_file: "~/.logbroker/token"
    parser:
    # How the destination table name is chosen:
    #   from_config — uses table_naming.name (e.g. "logs")
    #   from_topic  — uses topic_path as-is (e.g. "/cdc/prod/logs")
    table_naming:
      type: from_config
      name: "logs"
    parser_type: "json_parser"
    settings:
      chunk_splitter: "new-line"
      order_by: ["id", "ts"]
      columns:
        # Required — present in nearly every log line. Missing → row goes to DLQ.
        - jsonpath: "$.id"
          column_name: "id"
          arrow_type: "Utf8"
          nullable: false
        - jsonpath: "$.ts"
          column_name: "ts"
          arrow_type: "Utf8"
          nullable: false
        # Optional — not in every line. Missing → NULL (not DLQ).
        - jsonpath: "$.task_id"
          column_name: "task_id"
          arrow_type: "Utf8"
          nullable: true
        - jsonpath: "$.level"
          column_name: "level"
          arrow_type: "Utf8"
          nullable: true
        - jsonpath: "$.msg"
          column_name: "msg"
          arrow_type: "Utf8"
          nullable: true
        - jsonpath: "$.caller"
          column_name: "caller"
          arrow_type: "Utf8"
          nullable: true
        - jsonpath: "$.error"
          column_name: "error"
          arrow_type: "Utf8"
          nullable: true
        - jsonpath: "$.runtime"
          column_name: "runtime"
          arrow_type: "Utf8"
          nullable: true
        - jsonpath: "$.host"
          column_name: "host"
          arrow_type: "Utf8"
          nullable: true
        - jsonpath: "$.job_index"
          column_name: "job_index"
          arrow_type: "Int32"
          nullable: true
        - jsonpath: "$.src_type"
          column_name: "src_type"
          arrow_type: "Utf8"
          nullable: true
        - jsonpath: "$.dst_type"
          column_name: "dst_type"
          arrow_type: "Utf8"
          nullable: true

middlewares: []

sink:
  clickhouse:
    # ClickHouse Native Protocol (TLS): port 9440, NOT 8443 (8443 is HTTPS).
    # Yandex Cloud example: "klg-xxxx.db.yandex.net:9440"
    connection_string: ""
    database: "db1"
    batch_size: 10000
    max_linger_ms: 500
    max_connections: 4
    username: "user1"
    password: ""
    # TLS settings:
    # use_tls: true         # enable TLS (default true)
    # tls_domain: ""        # override SNI domain (if needed)
    # If the server uses a self-signed certificate and UnknownIssuer
    # persists even with new settings — try use_tls: false
    # (only if ClickHouse allows unencrypted connections).
