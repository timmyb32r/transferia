delivery_id: postgres-s3-demo
delivery_name: Demo delivery
delivery_type: batch
durable_storage: { type: local_file, path: .transferia-state }
source:
  postgres:
    installation:
      type: on_premise
      host: localhost
      port: 5432
      trusted_plaintext: true
    database: postgres
    username: postgres
    password: postgres
    tables:
      type: selected
      rules:
        - include: public.events

middlewares: []
pipeline_memory_limit_bytes: 268435456

sink:
  s3:
    bucket: transfer-bucket
    object_layout_version: 5
    prefix: postgres-snapshots
    region: us-east-1
    host: localhost
    port: 4566
    allow_http: true
    credentials:
      access_key: test
      secret_key: test
    partitioning:
      type: source
    rotation:
      max_rows: 100000
      max_bytes: 128MiB

metrics:
  interval_ms: 1000
  per_partition: true
