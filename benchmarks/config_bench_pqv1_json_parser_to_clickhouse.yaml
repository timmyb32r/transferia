# End-to-end PQv1 -> ClickHouse benchmark.
# Replace the endpoint/topic/credentials before running.
# cargo run --release -- --config benchmarks/config_bench_pqv1_json_parser_to_clickhouse.yaml

delivery_id: benchmark-pqv1-clickhouse
durable_storage: { type: local_file, path: .transferia-state }
source:
  pqv1:
    host: "${PQ_HOST:-localhost}"
    port: ${PQ_PORT:-2136}
    topic_path: "${PQ_TOPIC:-/benchmark/events}"
    consumer_name: "${PQ_CONSUMER_CLICKHOUSE:-transferia-benchmark-clickhouse}-${BENCHMARK_REPETITION:-manual}"
    partition_group_ids: [0]
    auth:
      type: access_token
      token: "${PQ_TOKEN:-benchmark-token}"
    parser:
      common:
        table_naming:
          type: from_config
          name: "events_${BENCHMARK_RUN_NAMESPACE:-manual}"
      json_parser:
        conversion_error: dlq
        unknown_fields: { action: fail }
        primary_key: [id, ts]
        chunk_splitter: "new-line"
        columns:
          - { jsonpath: "$.id", column_name: "id", json_data_type: string, arrow_type: "Utf8", nullable: false }
          - { jsonpath: "$.ts", column_name: "ts", json_data_type: string, arrow_type: "Utf8", nullable: false }
          - { jsonpath: "$.level", column_name: "level", json_data_type: string, arrow_type: "Utf8", nullable: true }
          - { jsonpath: "$.msg", column_name: "msg", json_data_type: string, arrow_type: "Utf8", nullable: true }

middlewares: []
pipeline_memory_limit_bytes: 268435456

sink:
  clickhouse:
    hosts: ["${CLICKHOUSE_HOST:-localhost}"]
    port: ${CLICKHOUSE_PORT:-9440}
    trusted_plaintext: true
    database: "${CLICKHOUSE_DATABASE:-default}"
    username: "${CLICKHOUSE_USERNAME:-default}"
    password: "${CLICKHOUSE_PASSWORD:-}"
    insert_target_rows: 10000
    insert_target_bytes: 67108864
    flush_interval_ms: 500
    retry_initial_ms: 50
    retry_max_ms: 30000
    retry_max_attempts: 20

metrics:
  enabled: true
  interval_ms: 1000
  per_partition: true
