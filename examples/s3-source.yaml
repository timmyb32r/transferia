# Finite, immutable S3 JSON snapshot -> ClickHouse.
# Objects are listed once, sorted by their complete object key, and read exactly once.
delivery_id: s3-source-demo
delivery_type: batch
durable_storage: { type: local_file, path: .transferia-state }
source:
  s3:
    bucket: source-bucket
    prefix: snapshots/2026-08-13
    region: us-east-1
    host: s3.example.net
    port: 443
    credentials:
      access_key: "${S3_ACCESS_KEY}"
      secret_key: "${S3_SECRET_KEY}"
    timeout_ms: 30000
    parser:
      common:
        table_naming: { type: from_config, name: events }
      json_parser:
        conversion_error: dlq
        unknown_fields: { action: fail }
        json_framing: single_document
        columns:
          - { jsonpath: "$.id", column_name: id, json_data_type: integer, arrow_type: Int64, nullable: false }

middlewares: []
pipeline_memory_limit_bytes: 268435456

sink:
  clickhouse:
    hosts: [clickhouse.internal]
    port: 9440
    database: default
    username: default
    trusted_plaintext: true

metrics:
  interval_ms: 1000
  per_partition: true
