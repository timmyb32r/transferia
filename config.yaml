# PQv1 partition -> JSON -> S3
source:
  pqv1:
    # PQv1 currently supports plaintext HTTP/2 only. Point this at a trusted
    # local endpoint/tunnel; grpcs:// is rejected instead of silently skipping TLS.
    discovery_endpoint: "grpc://localhost:2135"
    topic_path: "/cdc/prod/events"
    consumer_name: "transferia-consumer"
    # PQv1 consumer assignments are not authoritative topic metadata, so list
    # every source partition explicitly. Workers split this list by modulo.
    partition_group_ids: [0]
    auth:
      type: access_token
      token_file: "${HOME}/.logbroker/token"
    parser:
      common:
        table_naming:
          type: from_config
          name: events
        system_columns:
          topic: true
          partition: true
          offset: true
          message_index: true
          write_timestamp_ms: true
      json_parser:
        chunk_splitter: one-message-one-row
        columns:
          - jsonpath: "$.id"
            column_name: id
            arrow_type: Int64
            nullable: false

middlewares: []
pipeline_memory_limit_bytes: 268435456
keep_system_columns_in_sink: false

sink:
  s3:
    bucket: transfer-bucket
    object_layout_version: 4
    prefix: streams
    region: ru-central1
    endpoint: "https://storage.yandexcloud.net"
    credentials:
      access_key: "${S3_ACCESS_KEY}"
      secret_key: "${S3_SECRET_KEY}"
    partitioning:
      type: source
    rotation:
      max_rows: 100000
      max_bytes: 128MiB
      on_partition_path_change: keep_epoch
    buffering:
      max_epoch_buffers: 128
      max_pending_upload_objects: 512
      max_buffered_bytes: 256MiB
      # Deterministic retained epoch budget (payload + routing metadata).
      max_epoch_bytes: 64MiB
    upload:
      multipart_threshold: 25MiB
      part_size: 25MiB
      parallel_parts: 4
      max_in_flight_objects: 4
    retry:
      initial_backoff: 200ms
      max_backoff: 30s
      max_attempts: 20

metrics:
  enabled: true
  interval_ms: 1000
  per_partition: true
