# PQv1 -> discard sink: measures download + decompression + JSON parsing.
# Replace the endpoint/topic/consumer/token values before running.
# cargo run --release -- --config benchmarks/config_bench_pqv1_json_parser_to_discard.yaml

source:
  pqv1:
    discovery_endpoint: "${PQ_ENDPOINT:-grpc://localhost:2136}"
    topic_path: "${PQ_TOPIC:-/benchmark/events}"
    consumer_name: "${PQ_CONSUMER_JSON:-transferia-benchmark-json-parser}-${BENCHMARK_REPETITION:-manual}"
    partition_group_ids: [0]
    auth:
      type: access_token
      token: "${PQ_TOKEN:-benchmark-token}"
    parser:
      common:
        table_naming:
          type: from_config
          name: "events"
      json_parser:
        chunk_splitter: "new-line"
        columns:
          - { jsonpath: "$.id", column_name: "id", arrow_type: "Utf8", nullable: false }
          - { jsonpath: "$.ts", column_name: "ts", arrow_type: "Utf8", nullable: false }
          - { jsonpath: "$.level", column_name: "level", arrow_type: "Utf8", nullable: true }
          - { jsonpath: "$.msg", column_name: "msg", arrow_type: "Utf8", nullable: true }

middlewares: []
pipeline_memory_limit_bytes: 268435456

sink:
  discard: {}

metrics:
  enabled: true
  interval_ms: 1000
  per_partition: true
