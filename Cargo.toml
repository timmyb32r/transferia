
[package]
name = "transferia"
version.workspace = true
edition.workspace = true
description = "Native Rust data transfer pipeline demo"
publish.workspace = true
[workspace]
members = [
    ".",
    "crates/transferia-composition",
    "crates/transferia-connector-clickhouse",
    "crates/transferia-connector-iceberg",
    "crates/transferia-connector-kafka",
    "crates/transferia-connector-logbroker",
    "crates/transferia-connector-mysql",
    "crates/transferia-connector-postgres",
    "crates/transferia-connector-s3",
    "crates/transferia-connector-support",
    "crates/transferia-connector-ydb",
    "crates/transferia-connector-ytsaurus",
    "crates/transferia-connectors",
    "crates/transferia-control-plane",
    "crates/transferia-core",
    "crates/transferia-delivery",
    "crates/transferia-delivery-contracts",
    "crates/transferia-middleware-datafusion",
    "crates/transferia-middleware-filter",
    "crates/transferia-pipeline",
    "crates/transferia-registry",
    "crates/transferia-runtime",
    "crates/transferia-runtime-local",
    "crates/transferia-server-contracts",
    "crates/transferia-server-ui",
    "crates/transferia-test-support",
]
exclude = ["vendor/clickhouse-arrow"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1"
apache-avro = "0.21"
arrow = "57"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bigdecimal = "0.4"
bytes = "1"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
clickhouse-arrow = { version = "0.2", default-features = false, features = ["inner_pool"] }
datafusion = { version = "52", default-features = false, features = ["nested_expressions", "regex_expressions", "sql", "string_expressions", "unicode_expressions"] }
flate2 = "1"
futures-util = "0.3"
getrandom = { version = "0.3", features = ["std"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http2", "tokio"] }
iceberg = "0.9.0"
iceberg-catalog-rest = "0.9.0"
itoa = "1"
jsonpath_lib = "0.3"
jsonschema = { version = "0.33.0", default-features = false }
lz4_flex = "0.12"
mimalloc = { version = "0.1", features = ["v2"] }
murmur3 = "0.5.2"
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls"] }
object_store = { version = "0.12", default-features = false, features = ["aws"] }
opendal = { version = "0.55.0", default-features = false, features = ["executors-tokio", "services-s3", "services-webhdfs"] }
parquet = "57"
postgres-types = { version = "0.2", features = ["with-chrono-0_4"] }
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
protox = "0.9"
rdkafka = "0.39"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
ryu = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
shellexpand = "3"
simd-json = "0.17"
testcontainers = { version = "0.27.3", features = ["http_wait_plain"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["fs", "rt-multi-thread", "signal", "time", "sync", "macros", "net", "process", "io-util", "test-util"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tokio-postgres-rustls = { version = "0.14", features = ["aws-lc-rs"] }
tokio-rustls = "0.26"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14", default-features = false }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
typetag = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
ydb-grpc = "0.2.2"
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
non_ascii_idents = "deny"
keyword_idents_2024 = "deny"
let_underscore_drop = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Production code must propagate or explicitly model failures. Test code may
# panic for concise assertions; clippy.toml scopes those exceptions to tests.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"

# Keep debugging output and intentionally leaked resources out of production.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"

# Suppressions must remain narrow, justified, and self-expiring where possible.
allow_attributes_without_reason = "deny"

# Resource-shape diagnostics are useful but may require measured exceptions.
large_futures = "warn"
large_stack_arrays = "warn"

# This is a private application rather than a crates.io package, and duplicate
# transitive versions are controlled by upstream dependency graphs.
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

# === muted: project-inappropriate lints ===
cast_possible_truncation = "allow"        # data-pipeline code casts sizes (len, batch) to u32 for Arrow — value always fits
cast_precision_loss = "allow"             # u64→f64 in metrics rate/percent math — 52-bit mantissa is fine for throughput
cast_sign_loss = "allow"                  # f64→u64 in metrics math — values are non-negative byte/row counts
float_arithmetic = "allow"                # the metrics module is inherently float-heavy (rates, percentages, byte sizes)
too_many_arguments = "allow"              # extracting config structs for internal helpers is overkill
wildcard_imports = "allow"                # use super::* in mod tests is the standard Rust pattern
question_mark_used = "allow"              # `?` operator is the foundation of Rust error handling
absolute_paths = "allow"                  # super:: / self:: are idiomatic and survive module moves
as_conversions = "allow"                  # `as` casts (e.g. usize as u32) are standard, banning them is overly strict
single_call_fn = "allow"                  # extracting a function called once is a valid readability/documentation choice
arbitrary_source_item_ordering = "allow"  # item ordering is often semantic/logical, not alphabetical
min_ident_chars = "allow"                 # short names (i, j, x, y) are idiomatic in loops and closures
integer_division = "allow"                # integer division is a normal operation, banning it is too strict
integer_division_remainder_used = "allow" # modulo is a normal operation, banning it is too strict
missing_inline_in_public_items = "allow"  # inline decisions belong to the compiler, not manual annotation
mod_module_files = "allow"                # mod.rs is a valid and accepted Rust module style
module_name_repetitions = "allow"         # repeated domain names are sometimes clearer at module boundaries
rc_buffer = "allow"                       # Rc<Vec<T>> is fine, not always worth the refactor to Rc<[T]>
ref_patterns = "allow"                    # `ref` is sometimes needed in match ergonomics edge cases
return_and_then = "allow"                 # `return x.and_then(...)` is normal, readable code
single_match_else = "allow"               # match with one arm can be more readable than if-let-else
str_to_string = "allow"                   # both str.to_string() and str.to_owned() are equally acceptable
too_many_lines = "allow"                  # file size is dictated by the problem domain, not a lint
missing_docs_in_private_items = "allow"   # private helpers don't always need full documentation
similar_names = "allow"                   # handle / handler etc. are often intentionally similar
missing_panics_doc = "allow"              # overkill for internal/private functions
missing_errors_doc = "allow"              # overkill for internal/private functions
decimal_literal_representation = "allow"  # 0.0 is fine, _f64 suffix is visual noise
unused_self = "allow"                     # &self in method signature is sometimes required by a trait
used_underscore_binding = "allow"         # `_name` for "will be used later" is an accepted Rust idiom
implicit_return = "allow"                 # conflicts with needless_return — both cannot be satisfied simultaneously
arithmetic_side_effects = "allow"         # data-pipeline: batch sizes/indices are guaranteed to fit, wrapping is noise
pattern_type_mismatch = "allow"           # overly strict with third-party types (arrow DataType, etc.)
indexing_slicing = "allow"                # indices verified by surrounding logic; .get() for every access is noise

[dependencies]
transferia-composition = { path = "crates/transferia-composition" }
transferia-connectors = { path = "crates/transferia-connectors" }
transferia-control-plane = { path = "crates/transferia-control-plane" }
transferia-core = { path = "crates/transferia-core" }
transferia-delivery = { path = "crates/transferia-delivery" }
transferia-middleware-datafusion = { path = "crates/transferia-middleware-datafusion" }
transferia-middleware-filter = { path = "crates/transferia-middleware-filter" }
transferia-registry = { path = "crates/transferia-registry" }
transferia-runtime = { path = "crates/transferia-runtime" }
transferia-runtime-local = { path = "crates/transferia-runtime-local" }

[dev-dependencies]
anyhow.workspace = true
apache-avro.workspace = true
arrow.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
mysql_async.workspace = true
object_store.workspace = true
prost.workspace = true
prost-types.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
testcontainers.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ydb-grpc.workspace = true

[profile.dev]
debug = "line-tables-only"
incremental = false
split-debuginfo = "off"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
incremental = false
split-debuginfo = "off"

[profile.test.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[patch.crates-io]
clickhouse-arrow = { path = "vendor/clickhouse-arrow" }
