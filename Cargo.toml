[package]
name = "ydb-ch-replicator"
version = "0.1.0"
edition = "2021"
description = "YDB Topic to ClickHouse replicator (PoC)"

[dependencies]
ydb = { version = "0.13", features = ["force-exhaustive-all"] }
clickhouse-arrow = "0.2"
arrow = "57"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
simd-json = "0.17"
jsonpath_lib = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time", "sync", "macros"] }
tokio-util = "0.7"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
bytes = "1"
mimalloc = { version = "0.1", features = ["v2"] }
chrono = "0.4"
shellexpand = "3"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
