[package]
name = "ch-loader"
version = "0.1.0"
edition = "2021"
description = "Multi-source ClickHouse loader: YDB Topic, PQv1, S3 → Arrow → ClickHouse"

[dependencies]
ydb = { version = "0.13", features = ["force-exhaustive-all"] }
clickhouse-arrow = "0.2"
arrow = "57"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
simd-json = "0.17"
itoa = "1"
ryu = "1"
jsonpath_lib = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time", "sync", "macros"] }
tokio-util = "0.7"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
bytes = "1"
mimalloc = { version = "0.1", features = ["v2"] }
time = "0.3"
shellexpand = "3"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
tonic = { version = "0.14", features = ["transport", "tls-native-roots"] }
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http2", "tokio"] }
http = "1"
tower = "0.5"
prost = "0.14"
prost-types = "0.14"
tonic-prost = "0.14"
flate2 = "1"
zstd = "0.13"
regex = "1"
object_store = { version = "0.12", default-features = false, features = ["aws"] }

[build-dependencies]
tonic-prost-build = "0.14"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
