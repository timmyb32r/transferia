source:
  postgres:
    connection: "host=localhost port=5432 user=postgres password=postgres dbname=postgres"
    trusted_plaintext: true
    tables:
      - schema: public
        name: events

middlewares: []
pipeline_memory_limit_bytes: 268435456
keep_system_columns_in_sink: false

sink:
  clickhouse:
    endpoint: "localhost:9000"
    trusted_plaintext: true
    database: default

metrics:
  enabled: true
  interval_ms: 1000
  per_partition: true
