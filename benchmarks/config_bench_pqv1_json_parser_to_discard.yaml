# PQv1 -> discard sink: measures download + decompression + JSON parsing.
# Replace the endpoint/topic/consumer/token values before running.
# cargo run --release -- --config benchmarks/config_bench_pqv1_json_parser_to_discard.yaml

delivery_id: benchmark-pqv1-parser
delivery_type: stream
durable_storage: { type: local_file, path: .transferia-state }
source:
  ydb_topic:
    host: "${PQ_HOST:-localhost}"
    port: ${PQ_PORT:-2136}
    topics:
      - path: "${PQ_TOPIC:-/benchmark/events}"
        partitions: [0]
    consumer_name: "${PQ_CONSUMER_JSON:-transferia-benchmark-json-parser}-${BENCHMARK_REPETITION:-manual}"
    auth:
      type: token
      token: "${PQ_TOKEN:-benchmark-token}"
    driver: pqv1
    trusted_plaintext: true
    parser:
      common:
        table_naming:
          type: from_config
          name: "events"
      json_parser:
        conversion_error: dlq
        unknown_fields: { action: fail }
        json_framing: "json_lines"
        columns:
          - { jsonpath: "$.id", column_name: "id", json_data_type: string, arrow_type: "Utf8", nullable: false }
          - { jsonpath: "$.ts", column_name: "ts", json_data_type: string, arrow_type: "Utf8", nullable: false }
          - { jsonpath: "$.level", column_name: "level", json_data_type: string, arrow_type: "Utf8", nullable: true }
          - { jsonpath: "$.msg", column_name: "msg", json_data_type: string, arrow_type: "Utf8", nullable: true }

middlewares: []
pipeline_memory_limit_bytes: 268435456

sink:
  discard: {}

metrics:
  interval_ms: 1000
  per_partition: true
