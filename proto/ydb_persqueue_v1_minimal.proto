syntax = "proto3";
package Ydb.PersQueue.V1;

// ---------------------------------------------------------------------------
// Codec enum — MUST match wire values exactly
// ---------------------------------------------------------------------------
enum Codec {
    CODEC_UNSPECIFIED = 0;
    CODEC_RAW = 1;
    CODEC_GZIP = 2;
    CODEC_LZOP = 3;
    CODEC_ZSTD = 4;
}

// ---------------------------------------------------------------------------
// Path — used for topic references throughout
// ---------------------------------------------------------------------------
message Path {
    string path = 1;
}

// ---------------------------------------------------------------------------
// Client → Server messages (MigrationStreamingRead request stream)
// ---------------------------------------------------------------------------
message MigrationStreamingReadClientMessage {
    oneof request {
        InitRequest init_request = 1;
        Read read = 2;
        StartRead start_read = 3;
        Commit commit = 4;
        Released released = 5;
        Status status = 6;
    }
    bytes token = 20;
}

message TopicReadSettings {
    string topic = 1;
    repeated int64 partition_group_ids = 2;
    int64 start_from_written_at_ms = 3;
}

message ReadParams {
    uint32 max_read_messages_count = 1;
    uint32 max_read_size = 2;
}

message InitRequest {
    repeated TopicReadSettings topics_read_settings = 1;
    bool read_only_original = 2;
    string consumer = 3;
    int64 max_lag_duration_ms = 4;
    int64 start_from_written_at_ms = 5;
    int64 max_supported_block_format_version = 6;
    int64 max_meta_cache_size = 10;
    ReadParams read_params = 42;
    string session_id = 100;
    int64 connection_attempt = 101;
}

message Read {} // empty — solicits DataBatch from server

message StartRead {
    Path topic = 1;
    string cluster = 2;
    uint64 partition = 3;
    uint64 assign_id = 4;
    uint64 read_offset = 5;
    uint64 commit_offset = 6;
    bool verify_read_offset = 8;
}

message Commit {
    repeated CommitCookie cookies = 1;
    repeated OffsetRange offset_ranges = 2;
}

message CommitCookie {
    uint64 assign_id = 1;
    uint64 partition_cookie = 2;
}

message OffsetRange {
    uint64 assign_id = 1;
    uint64 start_offset = 2;
    uint64 end_offset = 3;
}

message Released {
    Path topic = 1;
    string cluster = 2;
    uint64 partition = 3;
    uint64 assign_id = 4;
}

message Status {
    Path topic = 1;
    string cluster = 2;
    uint64 partition = 3;
    uint64 assign_id = 4;
}

// ---------------------------------------------------------------------------
// Server → Client messages (MigrationStreamingRead response stream)
// CRITICAL: status(1) and issues(2) are TOP-LEVEL fields, NOT in the oneof.
// ---------------------------------------------------------------------------
message MigrationStreamingReadServerMessage {
    int32 status = 1;                      // 0 = SUCCESS
    repeated IssueMessage issues = 2;
    oneof response {
        InitResponse init_response = 3;
        DataBatch data_batch = 4;
        Assigned assigned = 5;
        Release release = 6;
        Committed committed = 7;
        PartitionStatus partition_status = 8;
    }
}

message IssueMessage {
    uint32 issue_code = 1;
    string message = 2;
}

message InitResponse {
    string session_id = 1;
    map<string, int64> block_format_version_by_topic = 2;
    int64 max_meta_cache_size = 10;
}

message Assigned {
    Path topic = 1;
    string cluster = 2;
    uint64 partition = 3;
    uint64 assign_id = 4;
    uint64 read_offset = 5;
    uint64 end_offset = 6;
}

message Release {
    Path topic = 1;
    string cluster = 2;
    uint64 partition = 3;
    uint64 assign_id = 4;
    bool forceful_release = 5;
    uint64 commit_offset = 6;
}

message Committed {
    repeated CommitCookie cookies = 1;
    repeated OffsetRange offset_ranges = 2;
}

message PartitionStatus {
    Path topic = 1;
    string cluster = 2;
    uint64 partition = 3;
    uint64 assign_id = 4;
    uint64 committed_offset = 5;
    uint64 end_offset = 6;
    uint64 write_watermark_ms = 7;
}

// ---------------------------------------------------------------------------
// DataBatch — the core data-bearing message
// ---------------------------------------------------------------------------
message DataBatch {
    repeated PartitionData partition_data = 1;
}

message PartitionData {
    Path topic = 1;
    string cluster = 2;
    uint64 partition = 3;
    repeated Batch batches = 4;
    CommitCookie cookie = 5;
    string deprecated_topic = 10;
}

message Batch {
    repeated MessageData message_data = 1;
    bytes source_id = 2;
    repeated KeyValue extra_fields = 3;
    uint64 write_timestamp_ms = 4;
    string ip = 5;
}

message MessageData {
    uint64 offset = 1;
    uint64 seq_no = 2;
    uint64 create_timestamp_ms = 3;
    Codec codec = 4;
    bytes data = 5;              // COMPRESSED body
    uint64 uncompressed_size = 6;
    string partition_key = 7;
    bytes explicit_hash = 8;
}

message KeyValue {
    string key = 1;
    string value = 2;
}

// ---------------------------------------------------------------------------
// DescribeTopic (unary RPC)
// NOTE: Real Logbroker wraps this in Ydb.Operations.Operation.
// For MVP, we rely on static partition_ids in config as fallback.
// ---------------------------------------------------------------------------
message DescribeTopicRequest {
    string path = 1;
}

message DescribeTopicResult {
    TopicSettings settings = 1;
}

message TopicSettings {
    int32 partitions_count = 1;
}

// ---------------------------------------------------------------------------
// Service definition
// ---------------------------------------------------------------------------
service PersQueueService {
    rpc MigrationStreamingRead(stream MigrationStreamingReadClientMessage)
        returns (stream MigrationStreamingReadServerMessage);
    rpc DescribeTopic(DescribeTopicRequest) returns (DescribeTopicResult);
}
