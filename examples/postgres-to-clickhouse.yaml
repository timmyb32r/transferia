delivery_id: postgres-clickhouse-demo
delivery_type: batch
durable_storage: { type: local_file, path: .transferia-state }
source:
  postgres:
    host: localhost
    port: 5432
    database: postgres
    username: postgres
    password: postgres
    trusted_plaintext: true
    tables:
      - schema: public
        name: events

middlewares: []
pipeline_memory_limit_bytes: 268435456

sink:
  clickhouse:
    hosts: [localhost]
    port: 9440
    trusted_plaintext: true
    database: default
    username: default

metrics:
  interval_ms: 1000
  per_partition: true
