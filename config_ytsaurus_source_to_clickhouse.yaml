delivery_id: ytsaurus-clickhouse-demo
durable_storage: { type: local_file, path: .transferia-state }
source:
  ytsaurus:
    host: localhost
    port: 8000
    trusted_plaintext: true
    batch_rows: 65536
    tables:
      - path: //tmp/events
        output_name: events
sink:
  clickhouse:
    hosts: [localhost]
    port: 9000
    trusted_plaintext: true
    database: default
    username: default
keep_system_columns_in_sink: false
