# End-to-end PQv1 -> ClickHouse benchmark.
# Replace the endpoint/topic/credentials before running.
# cargo run --release -- --config benchmarks/config_bench_pqv1_json_parser_to_clickhouse.yaml

source:
  pqv1:
    discovery_endpoint: "${PQ_ENDPOINT:-grpc://localhost:2136}"
    topic_path: "${PQ_TOPIC:-/benchmark/events}"
    consumer_name: "${PQ_CONSUMER_CLICKHOUSE:-transferia-benchmark-clickhouse}-${BENCHMARK_REPETITION:-manual}"
    partition_ids: [0]
    auth:
      type: access_token
      token: "${PQ_TOKEN:-benchmark-token}"
    parser:
      common:
        table_naming:
          type: from_config
          name: "events_${BENCHMARK_RUN_NAMESPACE:-manual}"
      json_parser:
        chunk_splitter: "new-line"
        columns:
          - { jsonpath: "$.id", column_name: "id", arrow_type: "Utf8", nullable: false }
          - { jsonpath: "$.ts", column_name: "ts", arrow_type: "Utf8", nullable: false }
          - { jsonpath: "$.level", column_name: "level", arrow_type: "Utf8", nullable: true }
          - { jsonpath: "$.msg", column_name: "msg", arrow_type: "Utf8", nullable: true }

middlewares: []
pipeline_memory_limit_bytes: 268435456

sink:
  clickhouse:
    connection_string: "${CLICKHOUSE_ENDPOINT:-localhost:9000}"
    database: "${CLICKHOUSE_DATABASE:-default}"
    username: "${CLICKHOUSE_USERNAME:-default}"
    password: "${CLICKHOUSE_PASSWORD:-}"
    use_tls: false
    sorting_key: ["id", "ts"]
    max_insert_rows: 10000
    max_insert_bytes: 67108864
    flush_interval_ms: 500
    retry_initial_ms: 50
    retry_max_ms: 30000
    retry_max_attempts: 20

metrics:
  enabled: true
  interval_ms: 1000
  per_partition: true
