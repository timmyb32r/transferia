# PQv1 -> discard sink: measures download + decompression without parsing.
# cargo run --release -- --config benchmarks/config_bench_pqv1_decompress_to_discard.yaml

delivery_id: benchmark-pqv1-decompress
delivery_type: stream
durable_storage: { type: local_file, path: .transferia-state }
source:
  ydb_topic:
    host: "${PQ_HOST:-localhost}"
    port: ${PQ_PORT:-2136}
    topics:
      - path: "${PQ_TOPIC:-/benchmark/events}"
        partitions: [0]
    consumer_name: "${PQ_CONSUMER_DECOMPRESS:-transferia-benchmark-decompress}-${BENCHMARK_REPETITION:-manual}"
    auth:
      type: token
      token: "${PQ_TOKEN:-benchmark-token}"
    driver: pqv1
    trusted_plaintext: true
    parser:
      common:
        table_naming:
          type: from_config
          name: "events"
      benchmark_discard: {}

middlewares: []
pipeline_memory_limit_bytes: 268435456

sink:
  discard: {}

metrics:
  interval_ms: 1000
  per_partition: true
