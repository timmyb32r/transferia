# PQv1 partition -> JSON -> S3
delivery_id: pqv1-s3-demo
delivery_type: stream
durable_storage: { type: local_file, path: .transferia-state }
source:
  ydb_topic:
    # PQv1 currently supports plaintext HTTP/2 only. Point this at a trusted
    # local endpoint/tunnel; grpcs:// is rejected instead of silently skipping TLS.
    installation:
      type: on_premise
      host: localhost
      port: 2135
      trusted_plaintext: true
      auth:
        type: token_file
        token_file: "${HOME}/path/to/token"
    topics:
      - path: "/cdc/prod/events"
        partitions: [0]
    consumer_name: "transferia-consumer"
    # PQv1 consumer assignments are not authoritative topic metadata, so list
    # every source partition explicitly. Workers split this list by modulo.
    driver: pqv1
    parser:
      common:
        table_naming:
          type: from_config
          name: events
        system_columns:
          topic: _system_topic
          partition: _system_partition
          offset: _system_offset
          message_index: _system_message_index
          write_timestamp_ms: _system_write_timestamp_ms
      json_parser:
        conversion_error: dlq
        unknown_fields: { action: fail }
        json_framing: single_document
        columns:
          - jsonpath: "$.id"
            column_name: id
            json_data_type: number
            arrow_type: Int64
            nullable: false

middlewares: []
pipeline_memory_limit_bytes: 268435456

sink:
  s3:
    bucket: transfer-bucket
    object_layout_version: 5
    prefix: streams
    region: us-east-1
    host: s3.example.net
    port: 443
    credentials:
      access_key: "${S3_ACCESS_KEY}"
      secret_key: "${S3_SECRET_KEY}"
    partitioning:
      type: source
    rotation:
      max_rows: 100000
      max_bytes: 128MiB
      on_partition_path_change: keep_epoch
    buffering:
      max_epoch_buffers: 128
      max_pending_upload_objects: 512
      max_buffered_bytes: 256MiB
      # Deterministic retained epoch budget (payload + routing metadata).
      max_epoch_bytes: 64MiB
    upload:
      multipart_threshold: 25MiB
      part_size: 25MiB
      parallel_parts: 4
      max_in_flight_objects: 4
    retry:
      initial_backoff: 200ms
      max_backoff: 30s
      max_attempts: 20

metrics:
  interval_ms: 1000
  per_partition: true
