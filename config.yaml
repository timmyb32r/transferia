# YDB Topic → ClickHouse Replicator — Example Configuration

source:
  topic:
    connection_string: "grpc://localhost:2136/local"
    topic_path: "/local/test-topic"
    consumer_name: "replicator"
    auth:
      type: anonymous
    parser:
      table_naming:
        type: from_topic
      parser_type: json_parser
      settings:
        chunk_splitter: new-line
        columns:
          - jsonpath: "$.user_id"
            column_name: "user_id"
            arrow_type: "Int64"
          - jsonpath: "$.event_name"
            column_name: "event_name"
            arrow_type: "Utf8"
          - jsonpath: "$.created_at"
            column_name: "created_at"
            arrow_type: "Timestamp(Millisecond, None)"

middlewares:
  - type: filter
    field: event_name
    value: page_view

sink:
  connection_string: "localhost:9000"
  database: "default"
  batch_size: 1000
  username: "default"
  password: ""
