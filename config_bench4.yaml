# Transferia — Benchmark Configuration 4 (PQv1 → ClickHouse, EXACTLY-ONCE)
#
# Same as config_bench.yaml (full json_parser) but with exactly_once: true.
# The parser adds __system_partition / __system_offset columns; the ClickHouse
# sink dedups via the waterline (SELECT max(__system_offset) WHERE
# __system_partition = ?). Activates the optimized EO insert path in sink.rs
# and the `uniq off/s` metric.
#
# Run:
#   transferia --config config_bench4.yaml --total-workers 1 --worker-index 0

source:
  pqv1:
    connection_string: ""
    topic_path: "/cdc/prod/logs"
    consumer_name: "cdc/prod/timmyb32r-test-consumer-00"
    discovery_endpoint: ""
    partition_ids: [0]
    auth:
      type: access_token
      token_file: "~/.logbroker/token"
    parser:
      table_naming:
        type: from_config
        name: "logs"
      json_parser:
        chunk_splitter: "new-line"
        order_by: ["id", "ts"]
        columns:
          - jsonpath: "$.id"
            column_name: "id"
            arrow_type: "Utf8"
            nullable: false
          - jsonpath: "$.ts"
            column_name: "ts"
            arrow_type: "Utf8"
            nullable: false
          - jsonpath: "$.task_id"
            column_name: "task_id"
            arrow_type: "Utf8"
            nullable: true
          - jsonpath: "$.level"
            column_name: "level"
            arrow_type: "Utf8"
            nullable: true
          - jsonpath: "$.msg"
            column_name: "msg"
            arrow_type: "Utf8"
            nullable: true
          - jsonpath: "$.caller"
            column_name: "caller"
            arrow_type: "Utf8"
            nullable: true
          - jsonpath: "$.error"
            column_name: "error"
            arrow_type: "Utf8"
            nullable: true
          - jsonpath: "$.runtime"
            column_name: "runtime"
            arrow_type: "Utf8"
            nullable: true
          - jsonpath: "$.host"
            column_name: "host"
            arrow_type: "Utf8"
            nullable: true
          - jsonpath: "$.job_index"
            column_name: "job_index"
            arrow_type: "Int32"
            nullable: true
          - jsonpath: "$.src_type"
            column_name: "src_type"
            arrow_type: "Utf8"
            nullable: true
          - jsonpath: "$.dst_type"
            column_name: "dst_type"
            arrow_type: "Utf8"
            nullable: true

middlewares: []

sink:
  clickhouse:
    connection_string: ""
    database: "db1"
    batch_size: 10000
    max_linger_ms: 500
    max_connections: 4
    username: "user1"
    password: ""

# Exactly-once delivery (dedup by source offset in the ClickHouse waterline).
exactly_once: true

metrics:
  enabled: true
  interval_ms: 1000
  per_partition: true
