# Docker Compose — local transferia development dependencies
#
# Start:  docker compose -f docker-compose/docker-compose.yaml up -d
# Verify: docker exec -it clickhouse clickhouse-client -q "SELECT 1"
#
# transferia creates and validates ClickHouse tables at runtime; this compose
# file intentionally does not install a separate, example-specific schema.

services:
  # YDB local instance for development/testing
  ydb:
    image: ydbplatform/local-ydb:25.4.1
    container_name: ydb-local
    hostname: ydb
    environment:
      YDB_USE_IN_MEMORY_PDISKS: "true"
      GRPC_PORT: "2136"
      GRPC_TLS_PORT: "2135"
    ports:
      - "2136:2136"
      - "2135:2135"
    volumes:
      - ydb-data:/ydb_data
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:2136"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ClickHouse server
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.28.1
    container_name: clickhouse
    hostname: clickhouse
    ports:
      - "9000:9000"    # Native Protocol
      - "8123:8123"    # HTTP Interface
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    volumes:
      - ch-data:/var/lib/clickhouse
    ulimits:
      nofile: 262144

  # Pinned S3 emulator for the S3 benchmark profile.
  localstack:
    image: localstack/localstack:4.14.0
    container_name: localstack
    hostname: localstack
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
    ports:
      - "9002:4566"
    volumes:
      - s3-data:/var/lib/localstack
      - ./localstack-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ydb-data:
  ch-data:
  s3-data:
