# PQv1 -> empty sink: measures network/read-loop throughput by dropping data
# before decompression.
# cargo run --release -- --config benchmarks/config_bench_yds_no_parser_and_decompress.yaml

source:
  pqv1:
    connection_string: "grpc://localhost:2135"
    topic_path: "/benchmark/events"
    consumer_name: "transferia-benchmark"
    partition_ids: [0]
    auth:
      type: access_token
      token_file: "$HOME/.logbroker/token"
    drop_before_decompress: true
    parser:
      common:
        table_naming:
          type: from_config
          name: "events"
      none: {}

middlewares: []
pipeline_memory_limit_bytes: 268435456

sink:
  empty: {}

metrics:
  enabled: true
  interval_ms: 1000
  per_partition: true
