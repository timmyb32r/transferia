# PQv1 -> empty sink: measures download + decompression + JSON parsing.
# Replace the endpoint/topic/consumer/token values before running.
# cargo run --release -- --config benchmarks/config_bench_yds_json_parser.yaml

source:
  pqv1:
    connection_string: "grpc://localhost:2135"
    topic_path: "/benchmark/events"
    consumer_name: "transferia-benchmark"
    partition_ids: [0]
    auth:
      type: access_token
      token_file: "$HOME/.logbroker/token"
    parser:
      common:
        table_naming:
          type: from_config
          name: "events"
      json_parser:
        chunk_splitter: "new-line"
        columns:
          - { jsonpath: "$.id", column_name: "id", arrow_type: "Utf8", nullable: false }
          - { jsonpath: "$.ts", column_name: "ts", arrow_type: "Utf8", nullable: false }
          - { jsonpath: "$.level", column_name: "level", arrow_type: "Utf8", nullable: true }
          - { jsonpath: "$.msg", column_name: "msg", arrow_type: "Utf8", nullable: true }

middlewares: []
pipeline_memory_limit_bytes: 268435456

sink:
  empty: {}

metrics:
  enabled: true
  interval_ms: 1000
  per_partition: true
