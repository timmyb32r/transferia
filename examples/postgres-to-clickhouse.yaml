delivery_id: postgres-clickhouse-demo
delivery_name: Demo delivery
delivery_type: batch
durable_storage: { type: local_file, path: .transferia-state }
source:
  postgres:
    installation:
      type: on_premise
      host: localhost
      port: 5432
      trusted_plaintext: true
    database: postgres
    username: postgres
    password: postgres
    tables:
      rules:
        - include: public.events

middlewares: []
pipeline_memory_limit_bytes: 268435456

sink:
  clickhouse:
    installation:
      type: on_premise
      hosts: [localhost]
      port: 9440
      trusted_plaintext: true
    database: default
    username: default

metrics:
  interval_ms: 1000
  per_partition: true
