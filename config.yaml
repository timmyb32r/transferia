# PQv1 partition -> JSON -> S3
source:
  pqv1:
    connection_string: "grpcs://sas.logbroker.yandex.net:2135"
    topic_path: "/cdc/prod/events"
    consumer_name: "transferia-consumer"
    auth:
      type: access_token
      token_file: "~/.logbroker/token"
    parser:
      common:
        table_naming:
          type: from_config
          name: events
        system_columns:
          topic_name: true
          partition_num: true
          offset: true
          message_index: true
          write_timestamp_ms: true
      json_parser:
        chunk_splitter: one-message-one-row
        columns:
          - jsonpath: "$.id"
            column_name: id
            arrow_type: Int64
            nullable: false

middlewares: []
pipeline_memory_limit_bytes: 268435456
keep_system_columns_in_sink: false

sink:
  s3:
    bucket: transfer-bucket
    prefix: streams
    region: ru-central1
    endpoint: "https://storage.yandexcloud.net"
    credentials:
      access_key: "${S3_ACCESS_KEY}"
      secret_key: "${S3_SECRET_KEY}"
    partitioning:
      type: source
    rotation:
      max_rows: 100000
      max_bytes: 128MiB
      on_partition_change: keep_open
    buffering:
      max_open_objects: 128
      max_buffered_bytes: 256MiB
    upload:
      multipart_threshold: 25MiB
      part_size: 25MiB
      parallel_parts: 4
      max_in_flight_objects: 4
    retry:
      initial_backoff: 200ms
      max_backoff: 30s

metrics:
  enabled: true
  interval_ms: 1000
  per_partition: true
