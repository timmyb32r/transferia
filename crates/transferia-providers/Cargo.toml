[package]
name = "transferia-providers"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["all-providers"]
all-providers = [
    "provider-clickhouse",
    "provider-kafka",
    "provider-logbroker",
    "provider-postgres",
    "provider-s3",
    "provider-ytsaurus",
]
provider-clickhouse = ["dep:clickhouse-arrow"]
provider-kafka = ["dep:rdkafka"]
provider-logbroker = ["dep:tonic-prost-build", "dep:ydb-grpc"]
provider-postgres = ["dep:postgres-types", "dep:tokio-postgres", "dep:tokio-postgres-rustls"]
provider-s3 = ["dep:object_store"]
provider-ytsaurus = []

[dependencies]
anyhow.workspace = true
apache-avro.workspace = true
arrow.workspace = true
async-trait.workspace = true
base64.workspace = true
bigdecimal.workspace = true
bytes.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
clickhouse-arrow = { workspace = true, optional = true }
flate2.workspace = true
futures-util.workspace = true
http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
itoa.workspace = true
jsonpath_lib.workspace = true
jsonschema.workspace = true
object_store = { workspace = true, optional = true }
postgres-types = { workspace = true, optional = true }
prost.workspace = true
prost-reflect.workspace = true
prost-types.workspace = true
protox.workspace = true
rdkafka = { workspace = true, optional = true }
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
rustls-pemfile.workspace = true
ryu.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
shellexpand.workspace = true
simd-json.workspace = true
time.workspace = true
tokio.workspace = true
tokio-postgres = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tower.workspace = true
tracing.workspace = true
transferia-core = { path = "../transferia-core" }
transferia-delivery-contracts = { path = "../transferia-delivery-contracts" }
transferia-registry = { path = "../transferia-registry" }
ydb-grpc = { workspace = true, optional = true }
zstd.workspace = true

[build-dependencies]
tonic-prost-build = { workspace = true, optional = true }

[dev-dependencies]
testcontainers.workspace = true
tokio-rustls.workspace = true
transferia-pipeline = { path = "../transferia-pipeline" }

[lints]
workspace = true
