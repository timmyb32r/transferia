# YDB Topic (CDC) → ClickHouse Replicator — Benchmark Configuration
#
# Запуск:
#   ydb-ch-replicator --config config_bench.yaml --total-workers 1 --worker-index 0

source:
  source_type: "pqv1"
  connection_string: "grpc://sas.logbroker.yandex.net:2135"
  topic_path: "/cdc/prod/logs"
  consumer_name: "cdc/prod/timmyb32r-test-consumer-00"
  discovery_endpoint: "grpc://sas.logbroker.yandex.net:2135"
  partition_ids: [0]
  auth:
    type: access_token
    token_file: "~/.logbroker/token"
  parser:
    # Как выбирается имя целевой таблицы:
    #   from_config — берётся table_naming.name (напр. "logs")
    #   from_topic  — берётся topic_path как есть (напр. "/cdc/prod/logs")
    table_naming:
      type: from_config
      name: "logs"
    parser_type: "json_parser"
    settings:
      order_by: ["id", "ts"]
      columns:
        # Required — есть практически в каждой строке лога. Отсутствие → строка в DLQ.
        - jsonpath: "$.id"
          column_name: "id"
          arrow_type: "Utf8"
          nullable: false
        - jsonpath: "$.ts"
          column_name: "ts"
          arrow_type: "Utf8"
          nullable: false
        # Optional — есть не в каждой строке. Отсутствие → NULL (не DLQ).
        - jsonpath: "$.task_id"
          column_name: "task_id"
          arrow_type: "Utf8"
          nullable: true
        - jsonpath: "$.level"
          column_name: "level"
          arrow_type: "Utf8"
          nullable: true
        - jsonpath: "$.msg"
          column_name: "msg"
          arrow_type: "Utf8"
          nullable: true
        - jsonpath: "$.caller"
          column_name: "caller"
          arrow_type: "Utf8"
          nullable: true
        - jsonpath: "$.error"
          column_name: "error"
          arrow_type: "Utf8"
          nullable: true
        - jsonpath: "$.runtime"
          column_name: "runtime"
          arrow_type: "Utf8"
          nullable: true
        - jsonpath: "$.host"
          column_name: "host"
          arrow_type: "Utf8"
          nullable: true
        - jsonpath: "$.job_index"
          column_name: "job_index"
          arrow_type: "Int32"
          nullable: true
        - jsonpath: "$.src_type"
          column_name: "src_type"
          arrow_type: "Utf8"
          nullable: true
        - jsonpath: "$.dst_type"
          column_name: "dst_type"
          arrow_type: "Utf8"
          nullable: true

middlewares: []

sink:
  connection_string: "klg-v4c8sf9k2aejn05u.db.yandex.net:9440"
  database: "db1"
  batch_size: 10000
  max_linger_ms: 500
  max_connections: 4
  username: "user1"
  password: "l%5v~gV?PSa{L1q#"
  recreate_tables: true
