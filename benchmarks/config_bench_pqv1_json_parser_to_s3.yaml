# End-to-end PQv1 -> S3 benchmark.
# Replace the endpoint/topic/token/bucket settings before running.
# cargo run --release -- --config benchmarks/config_bench_pqv1_json_parser_to_s3.yaml

delivery_id: benchmark-pqv1-s3
delivery_type: stream
durable_storage: { type: local_file, path: .transferia-state }
source:
  pqv1:
    host: "${PQ_HOST:-localhost}"
    port: ${PQ_PORT:-2136}
    topic_path: "${PQ_TOPIC:-/benchmark/events}"
    consumer_name: "${PQ_CONSUMER_S3:-transferia-benchmark-s3}-${BENCHMARK_REPETITION:-manual}"
    partition_group_ids: [0]
    auth:
      type: access_token
      token: "${PQ_TOKEN:-benchmark-token}"
    parser:
      common:
        table_naming:
          type: from_config
          name: "events"
        system_columns:
          topic: true
          partition: true
          offset: true
          message_index: true
          write_timestamp_ms: true
      json_parser:
        conversion_error: dlq
        unknown_fields: { action: fail }
        chunk_splitter: "one-message-one-row"
        columns:
          - { jsonpath: "$.id", column_name: "id", json_data_type: string, arrow_type: "Utf8", nullable: false }
          - { jsonpath: "$.ts", column_name: "ts", json_data_type: string, arrow_type: "Utf8", nullable: false }
          - { jsonpath: "$.level", column_name: "level", json_data_type: string, arrow_type: "Utf8", nullable: true }
          - { jsonpath: "$.msg", column_name: "msg", json_data_type: string, arrow_type: "Utf8", nullable: true }

middlewares: []
pipeline_memory_limit_bytes: 268435456

sink:
  s3:
    bucket: "${S3_BUCKET:-transferia-benchmark}"
    object_layout_version: 5
    prefix: "${S3_PREFIX:-pqv1-s3}/${BENCHMARK_RUN_NAMESPACE:-manual}"
    region: "${S3_REGION:-us-east-1}"
    host: "${S3_HOST:-localhost}"
    port: ${S3_PORT:-9002}
    allow_http: true
    credentials:
      access_key: "${S3_ACCESS_KEY:-test}"
      secret_key: "${S3_SECRET_KEY:-test}"
    partitioning:
      type: source
    rotation:
      max_rows: 100000
      max_bytes: "64MiB"
    buffering:
      max_epoch_buffers: 32
      max_pending_upload_objects: 128
      max_buffered_bytes: "256MiB"
      max_epoch_bytes: "64MiB"
    upload:
      multipart_threshold: "16MiB"
      part_size: "8MiB"
      parallel_parts: 4
      max_in_flight_objects: 4
      operation_timeout: "1m"
    retry:
      initial_backoff: "200ms"
      max_backoff: "30s"
      max_attempts: 20

metrics:
  enabled: true
  interval_ms: 1000
  per_partition: true
