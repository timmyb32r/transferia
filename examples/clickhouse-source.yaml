delivery_id: clickhouse-source-demo
delivery_name: Demo delivery
delivery_type: batch
durable_storage: { type: local_file, path: .transferia-state }
source:
  clickhouse:
    installation:
      type: on_premise
      hosts: [localhost]
      port: 9440
      trusted_plaintext: true
    username: default
    tables:
      type: selected
      rules:
        - include: default.events
sink:
  s3:
    bucket: clickhouse-snapshots
    region: us-east-1
    prefix: snapshots
    object_layout_version: 5
    partitioning: source
    rotation:
      max_rows: 100000
      max_bytes: 67108864
      max_epoch_bytes: 134217728
pipeline:
  memory_limit_bytes: 268435456
