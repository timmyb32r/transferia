# PQv1 -> discard sink: measures network/read-loop throughput by dropping data
# before decompression.
# cargo run --release -- --config benchmarks/config_bench_pqv1_network_to_discard.yaml

delivery_id: benchmark-pqv1-network
delivery_name: Demo delivery
delivery_type: stream
durable_storage: { type: local_file, path: .transferia-state }
source:
  logbroker:
    installation:
      type: on_premise
      host: "${PQ_HOST:-localhost}"
      port: ${PQ_PORT:-2136}
      trusted_plaintext: true
    auth:
      type: token
      token: "${PQ_TOKEN:-benchmark-token}"
    topics:
      - path: "${PQ_TOPIC:-/benchmark/events}"
        partitions: [0]
    consumer_name: "${PQ_CONSUMER_NETWORK:-transferia-benchmark-network}-${BENCHMARK_REPETITION:-manual}"
    driver: pqv1
    pqv1_discard_before_decompression: true
    parser:
      common:
        table_naming:
          type: from_config
          name: "events"
      benchmark_discard: {}

middlewares: []
pipeline_memory_limit_bytes: 268435456

sink:
  discard: {}

metrics:
  interval_ms: 1000
  per_partition: true
